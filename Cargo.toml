[package]
name = "llmwatch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal UI monitor for a remote vLLM server and its GPUs"
repository = "https://github.com/HindrikStegenga/llmwatch"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.2", features = ["full"] }
